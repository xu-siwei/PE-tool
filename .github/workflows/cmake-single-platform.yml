name: Build on Commit & Release on Tag

on:
  push:
    branches: [ "master" ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: windows-latest

    env:
      BUILD_TYPE: Release
      ARCH: x64

    steps:
    - uses: actions/checkout@v4

    - name: Configure CMake (64-bit)
      run: |
        cmake -B ${{github.workspace}}/build `
        -G "Visual Studio 17 2022" `
        -A ${{ env.ARCH }} `
        -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
    
    - name: Build
      run: cmake --build ${{github.workspace}}/build --config ${{ env.BUILD_TYPE }} --parallel

    - name: Test
      working-directory: ${{github.workspace}}/build
      run: ctest -C ${{ env.BUILD_TYPE }} --output-on-failure

    - name: Verify Executable in build/Release
      run: dir ${{ github.workspace }}/build/Release

    # 🔑 动态生成产物名（用 bash 写入 $GITHUB_ENV）
    - name: Set artifact names
      shell: bash
      run: |
        echo "ARTIFACT_NAME=pe-tool-windows-${{ github.sha }}-${ARCH}.exe" >> $GITHUB_ENV
        echo "RELEASE_ARTIFACT_NAME=pe-tool-windows-${{ github.ref_name }}-${ARCH}.exe" >> $GITHUB_ENV

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref }}
        release_name: Release ${{ github.ref_name }}
        draft: false
        prerelease: false

    - name: Upload Release Asset (Any EXE in Release)
      if: startsWith(github.ref, 'refs/tags/')
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ${{ github.workspace }}/build/Release/*.exe
        asset_name: ${{ env.RELEASE_ARTIFACT_NAME }}
        asset_content_type: application/octet-stream

    - name: Upload Temporary Artifact (For Non-Tag Commits)
      if: ${{ !startsWith(github.ref, 'refs/tags/') }}
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.ARTIFACT_NAME }}
        path: ${{ github.workspace }}/build/Release/*.exe
